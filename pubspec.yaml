class AudioPlayerScreen extends StatefulWidget {
  final ReciterModel reciter;
  final int surahNumber;
  final String surahName;

  const AudioPlayerScreen({
    Super.key,
    required this.reciter,
    required this.surahNumber,
    required this.surahName,
  });

  @override
  State<AudioPlayerScreen> createState() => _AudioPlayerScreenState();
}

class _AudioPlayerScreenState extends State<AudioPlayerScreen> {
  bool isPlaying = false;

  String get audioUrl {
    final formattedSurah = widget.surahNumber.toString().padLeft(3, '0');
    return '${widget.reciter.serverUrl}$formattedSurah.mp3';
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        title: Text('التلاوة: سورة ${widget.surahName}'),
        backgroundColor: const Color(0xFF03101C),
      ),
      body: Center(
        child: Padding(
          padding: const EdgeInsets.all(24.0),
          child: Column(
            mainAxisAlignment: MainAxisAlignment.center,
            children: [
              Container(
                width: 140,
                height: 140,
                decoration: BoxDecoration(
                  shape: BoxShape.circle,
                  color: const Color(0xFF0C2037),
                  border: Border.all(color: const Color(0xFFF0D078), width: 3),
                ),
                child: const Icon(Icons.graphic_eq, size: 70, color: Color(0xFFF0D078)),
              ),
              const SizedBox(height: 24),
              Text('الشيخ ${widget.reciter.name}', style: const TextStyle(fontSize: 20, fontWeight: FontWeight.bold, color: Colors.white)),
              const SizedBox(height: 8),
              Text('سورة ${widget.surahName} • ${widget.reciter.rewaya}', style: const TextStyle(fontSize: 14, color: Color(0xFF38BDF8))),
              const SizedBox(height: 24),
              Container(
                padding: const EdgeInsets.all(12),
                decoration: BoxDecoration(
                  color: const Color(0xFF0C2037),
                  borderRadius: BorderRadius.circular(12),
                ),
                child: SelectableText(
                  'رابط التلاوة المباشر:\n$audioUrl',
                  textAlign: TextAlign.center,
                  style: const TextStyle(fontSize: 11, color: Colors.grey),
                ),
              ),
              const SizedBox(height: 32),
              Row(
                mainAxisAlignment: MainAxisAlignment.center,
                children: [
                  IconButton(
                    iconSize: 64,
                    icon: Icon(isPlaying ? Icons.pause_circle_filled : Icons.play_circle_fill),
                    color: const Color(0xFFF0D078),
                    onPressed: () {
                      setState(() {
                        isPlaying = !isPlaying;
                      });
                      ScaffoldMessenger.of(context).showSnackBar(
                        SnackBar(content: Text(isPlaying ? 'جارٍ تشغيل سورة ${widget.surahName}' : 'تم إيقاف التلاوة')),
                      );
                    },
                  ),
                ],
              )
            ],
          ),
        ),
      ),
    );
  }
}

