void main() {
  WidgetsFlutterBinding.ensureInitialized();
  // Locking orientation to portrait for mobile users
  SystemChrome.setPreferredOrientations([DeviceOrientation.portraitUp]);
  runApp(const AtharApp());
}

class AtharApp extends StatelessWidget {
  const AtharApp({Super.key});

  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      title: 'أَثَر | ATHAR ROYAL',
      debugShowCheckedModeBanner: false,
      theme: ThemeData(
        brightness: Brightness.dark,
        scaffoldBackgroundColor: const Color(0xFF03101C),
        fontFamily: 'Tajawal',
        primaryColor: const Color(0xFFF0D078),
        colorScheme: const ColorScheme.dark(
          primary: Color(0xFFF0D078),
          secondary: Color(0xFF38BDF8),
          surface: Color(0xFF0C2037),
        ),
      ),
      home: const MainNavigationScreen(),
    );
  }
}

