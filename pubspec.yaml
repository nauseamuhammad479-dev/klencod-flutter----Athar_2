            const Text('سبحان الله وبحمده', style: TextStyle(fontSize: 20, color: Color(0xFF38BDF8), fontWeight: FontWeight.bold)),
            const SizedBox(height: 30),
            GestureDetector(
              onTap: () => setState(() => _counter++),
              child: Container(
                width: 180,
                height: 180,
                decoration: BoxDecoration(
                  shape: BoxShape.circle,
                  color: const Color(0xFF0C2037),
                  border: Border.all(color: const Color(0xFFF0D078), width: 4),
                  boxShadow: const [BoxShadow(color: Colors.black45, blurRadius: 10)],
                ),
                child: Center(
                  child: Text('$_counter', style: const TextStyle(fontSize: 48, fontWeight: FontWeight.bold, color: Color(0xFFF0D078))),
                ),
              ),
            ),
            const SizedBox(height: 30),
            ElevatedButton(
              onPressed: () => setState(() => _counter = 0),
              style: ElevatedButton.styleFrom(backgroundColor: Colors.redAccent),
              child: const Text('إعادة الضبط', style: TextStyle(color: Colors.white)),
            )
          ],
        ),
      ),
    );
  }
}

