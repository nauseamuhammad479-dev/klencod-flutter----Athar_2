class _TasbihScreenState extends State<TasbihScreen> {
  int _counter = 0;

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(title: const Text('السبحة الإلكترونية'), backgroundColor: const Color(0xFF03101C)),
      body: Center(
