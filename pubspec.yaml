class MainNavigationScreen extends StatefulWidget {
  const MainNavigationScreen({Super.key});

  @override
  State<MainNavigationScreen> createState() => _MainNavigationScreenState();
}

class _MainNavigationScreenState extends State<MainNavigationScreen> {
  int _currentIndex = 0;

  final List<Widget> _pages = const [
    HomeScreen(),
    QuranScreen(),
    RecitersScreen(),
    PrayerScreen(),
    MoreScreen(),
  ];

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      body: Directionality(
        textDirection: TextDirection.rtl,
        child: _pages[_currentIndex],
      ),
      bottomNavigationBar: Directionality(
        textDirection: TextDirection.rtl,
        child: BottomNavigationBar(
          currentIndex: _currentIndex,
          onTap: (index) => setState(() => _currentIndex = index),
          backgroundColor: const Color(0xFF06182B),
          selectedItemColor: const Color(0xFFF0D078),
          unselectedItemColor: Colors.slate300,
          type: BottomNavigationBarType.fixed,
          items: const [
            BottomNavigationBarItem(icon: Icon(Icons.home_outlined), label: 'الرئيسية'),
            BottomNavigationBarItem(icon: Icon(Icons.menu_book), label: 'المصحف'),
            BottomNavigationBarItem(icon: Icon(Icons.mic_none), label: 'القراء'),
            BottomNavigationBarItem(icon: Icon(Icons.mosque_outlined), label: 'الصلاة'),
            BottomNavigationBarItem(icon: Icon(Icons.grid_view), label: 'المزيد'),
          ],
        ),
      ),
    );
  }
}

